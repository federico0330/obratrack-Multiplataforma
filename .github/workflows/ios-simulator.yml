name: iOS Simulator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  access-flow:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Instalar herramientas iOS
        run: brew install xcodegen
      - name: Preparar configuración de prueba Firebase
        run: cp iosApp/GoogleService-Info.plist.example iosApp/GoogleService-Info.plist
      - name: Generar el Podspec de Kotlin
        run: ./gradlew :composeApp:podspec
      - name: Preparar framework para CocoaPods
        run: ./gradlew :composeApp:generateDummyFramework
      - name: Generar proyecto Xcode y resolver Pods
        run: |
          cd iosApp
          xcodegen generate --spec project.yml
          pod install
      - name: Ejecutar recorrido en iOS Simulator
        run: >-
          xcodebuild test
          -workspace iosApp/iosApp.xcworkspace
          -scheme ObraTrackIOS
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
      - name: Guardar resultado visual del simulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-test-results
          path: build/ios/Logs/Test/*.xcresult
          if-no-files-found: ignore
