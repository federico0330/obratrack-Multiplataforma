name: ObraTrackIOS
options:
  bundleIdPrefix: com.unaj.appmoviles
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  ObraTrackIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: GoogleService-Info.plist
      # Textos del Info.plist traducidos (permiso de cámara) en es, en e it.
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unaj.appmoviles.obratrack.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ObraTrack
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        # Sin esta clave iOS cierra la app al abrir la cámara.
        INFOPLIST_KEY_NSCameraUsageDescription: Para sacar fotos de los relevamientos de obra.
        TARGETED_DEVICE_FAMILY: "1,2"
        # El script de abajo edita el Info.plist ya generado; el sandbox de scripts no lo permite.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Google Sign-In vuelve a la app por un URL scheme igual a REVERSED_CLIENT_ID. Se copia desde
      # GoogleService-Info.plist (no versionado) para no escribir identificadores del proyecto en el repo.
      - name: URL scheme de Google Sign-In
        script: |
          FUENTE="${SRCROOT}/GoogleService-Info.plist"
          DESTINO="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          ESQUEMA=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$FUENTE" 2>/dev/null || true)
          if [ -z "$ESQUEMA" ]; then
            echo "warning: GoogleService-Info.plist no tiene REVERSED_CLIENT_ID; Google Sign-In no va a funcionar."
            exit 0
          fi
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$DESTINO" 2>/dev/null || true
          /usr/libexec/PlistBuddy             -c "Add :CFBundleURLTypes array"             -c "Add :CFBundleURLTypes:0 dict"             -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array"             -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $ESQUEMA"             "$DESTINO"
  ObraTrackIOSTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ObraTrackIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unaj.appmoviles.obratrack.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ObraTrackIOS
schemes:
  ObraTrackIOS:
    build:
      targets:
        ObraTrackIOS: all
        ObraTrackIOSTests: [test]
    test:
      targets:
        - ObraTrackIOSTests
      deleteScreenshotsWhenEachTestSucceeds: false
